# Backend FastAPI no Render.
#
# Aplicar: Render → New → Blueprint → aponte para este repositório.
# As variáveis marcadas `sync: false` NÃO ficam aqui: o Render pergunta o valor
# na criação e guarda cifrado. Nenhum segredo neste arquivo, que é versionado.
#
# `plan: free` é temporário, escolhido para colocar o sistema no ar.
#
# O free hiberna após ~15 minutos sem requisição, e hibernar encerra o processo.
# Com ele morre o APScheduler: a sincronização do Drive (a cada 5 min) e o
# alerta comercial (7h) só rodam enquanto alguém estiver usando a tela. Não dá
# erro — o sistema fica quieto.
#
# **Ao contratar um plano pago, troque para `plan: starter`.** É a única
# alteração necessária: os jobs voltam a rodar sozinhos, sem mais nada a mudar.

services:
  - type: web
    name: crm-operacional-api
    runtime: python
    plan: free
    # O Render não tem região na América do Sul. Confira no painel quais regiões
    # o plano free oferece: se Virginia estiver disponível, é a mais próxima do
    # Brasil e economiza cerca de 60ms em cada chamada da tela.
    region: oregon
    rootDir: backend
    # Sem `numInstances`: o free só permite uma, e é o que queremos. Com duas,
    # cada uma subiria o próprio APScheduler e os jobs disparariam em dobro —
    # transcrição sincronizada duas vezes, alerta comercial enviado duas vezes.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # --- obrigatórias ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PIPEDRIVE_API_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true  # o Render gera; não reaproveite o segredo local

      # Aceita o conteúdo do JSON colado direto, Base64 ou caminho de arquivo —
      # ver `get_drive_service()` em main.py. No Render use o JSON colado: não
      # há arquivo para apontar.
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false

      # --- assistente (cascata Gemini → NVIDIA) ---
      # Sem elas o resto do sistema funciona; só o assistente para de responder.
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false

      # --- CORS ---
      # Domínios do frontend, separados por vírgula. Preencher depois que a
      # Vercel devolver a URL. Ver a nota em main.py sobre o padrão.
      - key: CORS_ORIGINS
        sync: false
